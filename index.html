<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D3880" />
  <title>Song Swap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Palette inspired by seek.com.au (SEEK Blue, SEEK Pink / magenta CTA, cool neutrals) */
    :root {
      --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --seek-blue: #0d3880;
      --seek-blue-soft: #e9eef9;
      --seek-blue-mid: #3e63ad;
      --seek-pink: #e60278;
      --seek-pink-soft: #fde8f3;
      --seek-slate: #2e3849;
      --seek-page: #e8ecf2;
      --seek-line: rgba(13, 56, 128, 0.12);
      --label: #212121;
      --secondary-label: rgba(46, 56, 73, 0.72);
      --tertiary-label: rgba(46, 56, 73, 0.5);
      --separator: rgba(13, 56, 128, 0.14);
      --hairline: rgba(13, 56, 128, 0.1);
      --surface: #ffffff;
      --surface-muted: #f7f9fc;
      --tint-shadow: 0 4px 20px rgba(13, 56, 128, 0.08);
      --control-shadow: 0 2px 6px rgba(13, 56, 128, 0.1), 0 10px 22px rgba(13, 56, 128, 0.08);
      --radius-card: 12px;
      --radius-pill: 999px;
      --radius-icon: 10px;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-out: cubic-bezier(0.17, 0.84, 0.44, 1);
      --column-max: 440px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font);
      color: var(--label);
      background: var(--seek-page);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.55s var(--ease);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.is-playing {
      background: linear-gradient(
        135deg,
        var(--seek-blue-soft) 0%,
        var(--surface-muted) 40%,
        var(--seek-pink-soft) 100%
      );
      background-size: 160% 160%;
      animation: gradientShift 16s var(--ease) infinite;
    }

    @keyframes gradientShift {
      0%,
      100% {
        background-position: 0% 40%;
      }
      50% {
        background-position: 100% 60%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.is-playing {
        animation: none;
        background: linear-gradient(135deg, var(--seek-blue-soft) 0%, var(--surface-muted) 55%, var(--seek-pink-soft) 100%);
        background-size: 100% 100%;
      }

      .bars .bar {
        animation: none !important;
        transform: scaleY(0.4);
        opacity: 0.75;
      }
    }

    #yt-host {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .shell {
      width: 100%;
      max-width: var(--column-max);
      min-height: 100dvh;
      padding: max(1.125rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--surface);
    }

    @media (min-width: 520px) {
      body {
        padding: 0.65rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left));
      }

      .shell {
        min-height: calc(100dvh - 1.65rem);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(13, 56, 128, 0.1);
      }
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding-bottom: 0.125rem;
    }

    .mark-wrap {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-icon);
      display: grid;
      place-items: center;
      background: var(--surface-muted);
      border: 1px solid var(--seek-line);
    }

    header .mark {
      width: 28px;
      height: 28px;
      display: block;
    }

    header h1 {
      margin: 0;
      font-family: var(--font);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: -0.028em;
      line-height: 1.15;
      color: var(--seek-blue);
    }

    .tagline {
      margin: 0;
      padding: 0.55rem 0.75rem 1rem;
      text-align: left;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.012em;
      color: var(--secondary-label);
      max-width: 26rem;
      margin-inline: 0;
      flex-shrink: 0;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 1.05rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.375rem;
      padding: 0.5rem 0 1.125rem;
      min-height: 0;
    }

    .play-wrap {
      position: relative;
    }

    .play-wrap::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 2, 120, 0.16) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.45s var(--ease-out), transform 0.45s var(--ease-out);
      pointer-events: none;
      z-index: -1;
    }

    body.is-playing .play-wrap::before {
      opacity: 1;
      transform: scale(1);
    }

    button.play-pause {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--seek-line);
      background: var(--surface);
      color: var(--seek-blue);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--control-shadow);
      transition: transform 0.22s var(--ease-out), background 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out),
        border-color 0.22s var(--ease-out);
    }

    button.play-pause:hover:not(:disabled) {
      transform: scale(1.02);
      border-color: rgba(13, 56, 128, 0.22);
      background: var(--surface-muted);
    }

    button.play-pause:active:not(:disabled) {
      transform: scale(0.97);
      box-shadow: 0 1px 4px rgba(13, 56, 128, 0.1);
    }

    body.is-playing button.play-pause {
      background: var(--surface);
      border-color: rgba(230, 2, 120, 0.35);
      color: var(--seek-pink);
    }

    button.play-pause:focus {
      outline: none;
    }

    button.play-pause:focus-visible {
      outline: 3px solid rgba(230, 2, 120, 0.45);
      outline-offset: 3px;
    }

    button.play-pause:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button.play-pause svg {
      width: 38px;
      height: 38px;
    }

    .reveal-panel {
      width: 100%;
      max-width: 19.5rem;
      min-height: 5rem;
      padding: 1rem 1.125rem;
      border-radius: var(--radius-card);
      background: var(--surface-muted);
      border: 1px solid var(--hairline);
      box-shadow: 0 2px 8px rgba(13, 56, 128, 0.04);
      transition: background 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.35s var(--ease);
    }

    body.is-playing .reveal-panel {
      background: var(--surface);
      border-color: var(--separator);
      box-shadow: var(--tint-shadow);
    }

    .reveal {
      text-align: center;
      min-height: 3.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      width: 100%;
    }

    .reveal .placeholder {
      font-size: 1rem;
      font-weight: 400;
      font-style: normal;
      color: var(--tertiary-label);
      line-height: 1.45;
      letter-spacing: -0.011em;
    }

    body.is-playing .reveal .placeholder {
      display: none;
    }

    .reveal .meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      opacity: 0;
      transform: translateY(6px) scale(0.98);
      transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out);
      pointer-events: none;
    }

    body.is-playing.has-meta .reveal .meta {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .reveal .title {
      font-family: var(--font);
      font-weight: 700;
      font-size: 1.2rem;
      margin: 0;
      line-height: 1.25;
      letter-spacing: -0.022em;
      color: var(--label);
    }

    .error-banner {
      margin-top: 0.25rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--seek-slate);
      text-align: center;
      max-width: 19.5rem;
      margin-left: auto;
      margin-right: auto;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-pill);
      background: rgba(230, 2, 120, 0.08);
      border: 1px solid rgba(230, 2, 120, 0.22);
      display: none;
    }

    .error-banner.visible {
      display: block;
    }

    .bars {
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 44px;
    }

    body.is-playing:not(.yt-paused) .bars {
      display: flex;
    }

    .bars .bar {
      width: 7px;
      border-radius: 999px;
      background: rgba(13, 56, 128, 0.22);
      height: 100%;
      transform-origin: bottom center;
      animation: bounce 0.82s var(--ease) infinite;
    }

    body.is-playing:not(.yt-paused) .bars .bar {
      background: linear-gradient(180deg, var(--seek-pink), var(--seek-blue-mid));
    }

    .bars .bar:nth-child(1) {
      animation-delay: 0s;
    }
    .bars .bar:nth-child(2) {
      animation-delay: 0.07s;
    }
    .bars .bar:nth-child(3) {
      animation-delay: 0.14s;
    }
    .bars .bar:nth-child(4) {
      animation-delay: 0.21s;
    }
    .bars .bar:nth-child(5) {
      animation-delay: 0.28s;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: scaleY(0.3);
      }
      50% {
        transform: scaleY(1);
      }
    }

    footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.875rem;
      padding-top: 0.375rem;
    }

    .counter {
      text-align: center;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: -0.006em;
      text-transform: none;
      color: var(--secondary-label);
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-pill);
      background: var(--surface-muted);
      border: 1px solid var(--hairline);
      color: var(--secondary-label);
      font-variant-numeric: tabular-nums;
    }

    .completion {
      display: none;
      text-align: center;
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.45;
      margin: 0;
      padding: 0.875rem 1rem;
      border-radius: var(--radius-card);
      color: var(--secondary-label);
      background: var(--surface-muted);
      border: 1px solid var(--hairline);
    }

    body.exhausted .completion {
      display: block;
    }

    body.exhausted .counter {
      display: none;
    }

    .footer-whisper {
      margin: 0;
      padding: 0.25rem 0 0;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--tertiary-label);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5625rem;
    }

    button.ghost,
    button.primary {
      font-family: var(--font);
      font-weight: 600;
      font-size: 1.0625rem;
      letter-spacing: -0.022em;
      border-radius: var(--radius-pill);
      min-height: 3.125rem;
      padding: 0.6875rem 1.125rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4375rem;
      transition: transform 0.18s var(--ease-out), opacity 0.2s var(--ease), background 0.2s var(--ease),
        box-shadow 0.2s var(--ease);
      border: none;
    }

    button.ghost:focus,
    button.primary:focus {
      outline: none;
    }

    button.ghost:focus-visible,
    button.primary:focus-visible {
      outline: 3px solid rgba(230, 2, 120, 0.45);
      outline-offset: 2px;
    }

    /* SEEK-style magenta primary CTA (Another Song) */
    button.ghost {
      background: var(--seek-pink);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(230, 2, 120, 0.25), 0 10px 20px rgba(13, 56, 128, 0.12);
      border: 1px solid transparent;
    }

    button.ghost:hover:not(:disabled) {
      background: #cb0269;
      transform: translateY(-1px);
    }

    button.ghost:active:not(:disabled) {
      transform: translateY(0);
    }

    /* Slate secondary (shuffle again) — neutral SEEK tone */
    button.primary {
      background: var(--seek-slate);
      color: #fff;
      border: 1px solid transparent;
      box-shadow: var(--control-shadow);
    }

    button.primary:hover:not(:disabled) {
      background: #242e3f;
      transform: translateY(-1px);
    }

    button.primary:active:not(:disabled) {
      transform: translateY(0);
    }

    button.ghost:disabled,
    button.primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    button.ghost svg,
    button.primary svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      opacity: 1;
    }

    body.exhausted button#another {
      display: none;
    }

    body.exhausted #shuffleAgain {
      display: flex;
    }

    #shuffleAgain {
      display: none;
    }
  </style>
</head>

  <div class="shell">

      <h1>Song Swap</h1>

    <p class="tagline">
      Change the track in your head. Stuck on a silly earworm? Tap play—we’ll swap it for something just as catchy.
    </p>

    <main>

        <div class="reveal-panel">
          <div class="reveal">
            <p class="placeholder">Tap play to find out…</p>
            <div class="meta" id="meta" hidden role="status" aria-live="polite" aria-atomic="true">
              <p class="title" id="trackTitle"></p>
            </div>
          </div>
        </div>
        <div class="play-wrap">
          <button type="button" class="play-pause" id="playPause" aria-label="Play">
            <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M8 5v14l11-7L8 5z" />

        </div>
        <p class="error-banner" id="errorBanner" role="alert"></p>

        <div class="bars" aria-hidden="true">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </section>
    </main>

    <footer>
      <p class="completion" id="completion">
        You heard all 50 earworms in this round. Shuffle the deck for another spin through the pool.
      </p>
      <div class="actions">
        <button type="button" class="ghost" id="another" aria-label="Another song">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 8h11a4 4 0 0 1 0 8H9l2-2-1.4-1.4L5.8 16l4.2 4.2L11.4 19l-2-2h6a6 6 0 0 0 0-12H4V8zm0-4v4h2V4H4z"
            />
          </svg>
          Another Song
        </button>
        <button type="button" class="primary" id="shuffleAgain" aria-label="Shuffle and play again">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 8h11a4 4 0 0 1 0 8H9l2-2-1.4-1.4L5.8 16l4.2 4.2L11.4 19l-2-2h6a6 6 0 0 0 0-12H4V8zm0-4v4h2V4H4z"
            />
          </svg>
          Shuffle &amp; play again
        </button>
      </div>
      <p class="counter"><span class="counter-pill" id="counter">50 songs remaining</span></p>
      <p class="footer-whisper" aria-label="Made with love">Made with love ❤️</p>
    </footer>
  </div>

      { id: "CoCiE4IT_Sg", title: "If You're Happy and You Know It", artist: "Super Simple Songs" },
      { id: "C-u5WLJ9Yk4", title: "...Baby One More Time", artist: "Britney Spears" },
      { id: "-GPffhQtfGI", title: "MMMBop", artist: "Hanson" },
      { id: "r7qovpFAEGw", title: "Old Town Road", artist: "Lil Nas X" },
      { id: "Obi4iELWJ3Y", title: "Shalala Lala", artist: "Vengaboys" },
      { id: "6Zbi0XmGtMw", title: "We Like to Party!", artist: "Vengaboys" },
      { id: "ru0K8uYEZWw", title: "Can't Stop the Feeling!", artist: "Justin Timberlake" },
      { id: "y6Sxv-sUYtM", title: "Happy", artist: "Pharrell Williams" },
      { id: "vjW8wmF6VVE", title: "Watch Me (Whip/Nae Nae)", artist: "Silentó" },
      { id: "4m48GxpuxR8", title: "Single Ladies (Put a Ring on It)", artist: "Beyoncé" },
      { id: "xFrGuyw1V8s", title: "Dancing Queen", artist: "ABBA" },
      { id: "Qx2gvHjNhQ0", title: "Axel F", artist: "Harold Faltermeyer" },
      { id: "MtN1YnoL46Q", title: "The Duck Song", artist: "Bryant Oden" },
      { id: "s4QYI8ieHWQ", title: "Peanut Butter Jelly", artist: "Buckwheat Boyz" },
    ];

    const byId = new Map(SONGS.map((s) => [s.id, s]));

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let playedIds = new Set();
    let blockedIds = new Set();
    let queue = [];
    let unlocked = false;
    let player = null;
    let currentVideoId = null;

    const body = document.body;
    const playPause = document.getElementById("playPause");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const meta = document.getElementById("meta");
    const trackTitle = document.getElementById("trackTitle");
    const errorBanner = document.getElementById("errorBanner");
    const counter = document.getElementById("counter");
    const another = document.getElementById("another");
    const shuffleAgain = document.getElementById("shuffleAgain");

    function remainingCount() {
      const avail = new Set();
      for (const s of SONGS) {
        if (!playedIds.has(s.id) && !blockedIds.has(s.id)) avail.add(s.id);
      }
      return avail.size;
    }

    function rebuildQueue() {
      const ids = [];
      const seen = new Set();
      for (const s of SONGS) {
        if (playedIds.has(s.id) || blockedIds.has(s.id) || seen.has(s.id)) continue;
        seen.add(s.id);
        ids.push(s.id);
      }
      queue = shuffleInPlace(ids);
    }

    function setError(msg) {
      if (!msg) {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }

    function setExhausted(on) {
      if (on) {
        body.classList.add("exhausted");
        another.disabled = true;
      } else {
        body.classList.remove("exhausted");
        another.disabled = false;
      }
    }

    function updateCounter() {
      const n = remainingCount();
      counter.textContent = n === 1 ? "1 song remaining" : `${n} songs remaining`;
    }

    function setPlayButtonUi(playing) {
      if (playing) {
        playPause.setAttribute("aria-label", "Pause");
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
      } else {
        playPause.setAttribute("aria-label", "Play");
        iconPlay.style.display = "block";
        iconPause.style.display = "none";
      }
    }

    function applyUiPlayingSurface(playing) {
      if (playing) {
        body.classList.add("is-playing");
      } else {
        body.classList.remove("is-playing");
        body.classList.remove("has-meta");
        meta.hidden = true;
        currentVideoId = null;
      }
    }

    function showTrack(song) {
      trackTitle.textContent = song.title;
      meta.hidden = false;
      body.classList.add("has-meta");
    }

    function consumeNextId() {
      if (queue.length === 0) rebuildQueue();
      return queue.length ? queue.shift() : null;
    }

    function onQueueExhaustedAfterPlay() {
      if (remainingCount() === 0 && queue.length === 0) {
        setExhausted(true);
        updateCounter();
      }
    }

    function playFromUserGesture() {
      if (!player) return;
      if (body.classList.contains("exhausted")) return;

      let nextId = consumeNextId();
      if (!nextId) {
        setExhausted(true);
        updateCounter();
        return;
      }

      playedIds.add(nextId);
      updateCounter();
      onQueueExhaustedAfterPlay();

      unlocked = true;
      setError("");
      currentVideoId = nextId;
      const song = byId.get(nextId);
      if (song) showTrack(song);
      player.loadVideoById(nextId);
      applyUiPlayingSurface(true);
      setPlayButtonUi(true);
    }

    function togglePlayPause() {
      if (!player) return;
      const exhausted = body.classList.contains("exhausted");

      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        return;
      }

      if (state === YT.PlayerState.PAUSED && currentVideoId) {
        player.playVideo();
        return;
      }

      if (!currentVideoId || state === YT.PlayerState.UNSTARTED || state === YT.PlayerState.CUED) {
        if (exhausted && !currentVideoId) return;
        if (!currentVideoId) {
          playFromUserGesture();
        } else {
          unlocked = true;
          player.playVideo();
          applyUiPlayingSurface(true);
          setPlayButtonUi(true);
        }
      }
    }

    function anotherSong() {
      if (!player || body.classList.contains("exhausted")) return;
      setError("");

      if (!currentVideoId && !body.classList.contains("is-playing")) {
        playFromUserGesture();
        return;
      }

      if (remainingCount() === 0 && queue.length === 0) {
        setExhausted(true);
        updateCounter();
        return;
      }

      let nextId = consumeNextId();
      if (!nextId) {
        player.stopVideo();
        applyUiPlayingSurface(false);
        setPlayButtonUi(false);
        setExhausted(true);
        updateCounter();
        return;
      }

      playedIds.add(nextId);
      updateCounter();
      onQueueExhaustedAfterPlay();

      const song = byId.get(nextId);
      if (song) showTrack(song);
      currentVideoId = nextId;
      unlocked = true;
      player.loadVideoById(nextId);
      applyUiPlayingSurface(true);
      setPlayButtonUi(true);
    }

    function shufflePlayAgain() {
      playedIds = new Set();
      blockedIds = new Set();
      rebuildQueue();
      setExhausted(false);
      setError("");
      currentVideoId = null;
      if (player) player.stopVideo();
      applyUiPlayingSurface(false);
      setPlayButtonUi(false);
      updateCounter();
      unlocked = false;
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        body.classList.remove("yt-paused");
        setPlayButtonUi(true);
        applyUiPlayingSurface(true);
      } else if (e.data === YT.PlayerState.PAUSED) {
        body.classList.add("yt-paused");
        setPlayButtonUi(false);
      } else if (e.data === YT.PlayerState.ENDED) {
        body.classList.add("yt-paused");
        setPlayButtonUi(false);
      } else if (e.data === YT.PlayerState.BUFFERING) {
        body.classList.remove("yt-paused");
      }
    }

    function onPlayerError() {
      const badId = currentVideoId;
      setError("");
      if (badId) {
        playedIds.delete(badId);
        blockedIds.add(badId);
      }
      rebuildQueue();
      updateCounter();

      if (!unlocked) {
        player.stopVideo();
        applyUiPlayingSurface(false);
        setPlayButtonUi(false);
        return;
      }

      const nid = consumeNextId();
      if (!nid) {
        if (remainingCount() === 0) setExhausted(true);
        player.stopVideo();
        applyUiPlayingSurface(false);
        setPlayButtonUi(false);
        updateCounter();
        return;
      }

      playedIds.add(nid);
      updateCounter();
      currentVideoId = nid;
      const song = byId.get(nid);
      if (song) showTrack(song);
      player.loadVideoById(nid);
      applyUiPlayingSurface(true);
      setPlayButtonUi(true);
      onQueueExhaustedAfterPlay();
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt-player", {
        width: "320",
        height: "180",
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
        },
        events: {
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    playPause.addEventListener("click", () => {
      togglePlayPause();
    });

    another.addEventListener("click", () => {
      anotherSong();
    });

    shuffleAgain.addEventListener("click", () => {
      shufflePlayAgain();
    });

    rebuildQueue();
    updateCounter();

    const uniqueIds = new Set(SONGS.map((s) => s.id));
    if (uniqueIds.size !== POOL_SIZE || SONGS.length !== POOL_SIZE) {
      console.warn("SONGS must contain", POOL_SIZE, "unique video ids; got", SONGS.length, "entries,", uniqueIds.size, "unique.");
    }
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
